name: CI

on:
  push:
  pull_request:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python \
            python3-all python3-setuptools python3-requests fakeroot

      - name: Build the package
        run: make deb

      - name: Move .deb into the workspace
        # dpkg-buildpackage writes to the parent directory, which is outside
        # the workspace and cannot be uploaded as an artifact from there
        run: mv ../hpc-eff_*.deb .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hpc-eff-deb
          path: hpc-eff_*.deb
          if-no-files-found: error

  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y ipmitool make kernel-tools rpm-build rpmdevtools \
            python3 python3-setuptools

      - name: Build the package
        run: make clean rpmdevdirs sdist rpm

      - name: Move .rpm into the workspace
        # rpmbuild writes under $HOME/rpmbuild, which is outside the
        # workspace and cannot be uploaded as an artifact from there
        run: find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec mv {} . \;

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hpc-eff-rpm
          path: '*.rpm'
          if-no-files-found: error
